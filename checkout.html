<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Adding to your cart...</title>
    <script>
        (function() {
            // Get the product ID from the URL
            const urlParams = new URLSearchParams(window.location.search);
            const productId = urlParams.get('id');

            if (productId) {
                // Store the product ID to be processed on the main page
                sessionStorage.setItem('pendingProductId', productId);
            }

            // Redirect to the main shop
            window.location.href = '/';
        })();
    </script>
</head>
<body>
    <p>Adding item to your cart...</p>
</body>
</html>
